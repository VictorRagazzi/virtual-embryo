[project]
name = "virtualembryo"
version = "0.1.0"
description = "Virtual Embryo Challenge – temporal gene expression prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.11",
    "scanpy>=1.10",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "leidenalg>=0.10",
    "python-igraph>=0.11",
    "python-dotenv>=1.2.2",
    "moscot>=0.5",
    "scikit-learn>=1.4",
]


[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
